<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Sreelatha | Portfolio</title>
    <meta
      name="description"
      content="Sreelatha's portfolio showcasing projects, skills, and experience in web development."
    />
    <meta name="author" content="Sreelatha" />

    <!-- Open Graph (for LinkedIn, Facebook, etc.) -->
    <meta property="og:title" content="Sreelatha | Portfolio" />
    <meta
      property="og:description"
      content="Explore Sreelatha's projects, skills, and experience."
    />
    <meta property="og:type" content="website" />
    <!-- own image later -->
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:description"
      content="Explore Sreelatha's projects and skills."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts (moved here instead of CSS) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon (optional) -->
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
